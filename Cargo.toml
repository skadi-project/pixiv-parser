[package]
name = "pixiv_parser"
version = "1.0.4"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dotenvy = "0.15"
sha2 = "0.10"
